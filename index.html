<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bus Simulator BD</title>

<style>
*{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ width:100%; height:100%; overflow:hidden; background:#071017; font-family:system-ui,-apple-system,sans-serif; user-select:none; }
button{ border:0; outline:0; cursor:pointer; }
#game{ position:relative; width:100%; height:100%; overflow:hidden; }

/* SPLASH SCREEN */
#splash{
    position:absolute; inset:0; z-index:1000;
    display:flex; justify-content:center; align-items:center; flex-direction:column;
    background:radial-gradient(circle at center,#123746,#061015 70%); color:white;
    transition:opacity .4s ease;
}
.logo{
    width:85px; height:85px; border-radius:22px;
    display:flex; align-items:center; justify-content:center; font-size:40px;
    background:linear-gradient(135deg,#00e5ff,#008cff);
    box-shadow:0 15px 35px rgba(0,220,255,.3);
}
.splashTitle{ margin-top:16px; font-size:22px; font-weight:900; letter-spacing:1px; }
.splashSub{ margin-top:5px; color:#8ba4ad; font-size:13px; }
.loader{ margin-top:25px; width:150px; height:4px; border-radius:10px; overflow:hidden; background:#17303a; }
.loaderBar{ width:0%; height:100%; background:#00e5ff; animation:loading 1.2s forwards; }
@keyframes loading{ to{width:100%} }

/* ASSET LOADER OVERLAY */
#assetLoader{
    position:absolute; inset:0; z-index:900;
    display:none; justify-content:center; align-items:center; flex-direction:column;
    background:rgba(5,16,22,.88); backdrop-filter:blur(6px); color:white;
}
.assetBox{
    text-align:center; padding:22px; border-radius:18px;
    background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.1);
    width:80%; max-width:280px;
}
.assetBarBg{ width:100%; height:8px; border-radius:10px; background:#182b33; overflow:hidden; margin:14px 0 8px; }
#assetFill{ width:0%; height:100%; background:#00e5ff; transition:width .15s ease; }

/* MAIN MENU */
#menu{
    position:absolute; inset:0; display:none; overflow-y:auto;
    background:linear-gradient(rgba(3,12,17,.4),rgba(3,12,17,.95)), radial-gradient(circle at 70% 20%,#16566a,#061015 70%);
    color:white;
}
.topbar{ height:60px; display:flex; align-items:center; justify-content:space-between; padding:0 20px; }
.brand{ font-size:18px; font-weight:900; }
.brand span{ color:#00e5ff; }
.money{ padding:6px 12px; border-radius:12px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.1); font-size:13px; }
.hero{ padding:25px 20px 10px; }
.hero small{ color:#8ea5ad; font-weight:bold; }
.hero h1{ margin-top:5px; font-size:30px; line-height:1.15; }
.hero h1 span{ color:#00e5ff; }
.menuButtons{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; padding:20px; max-width:600px; }
.menuBtn{
    min-height:90px; border-radius:18px; color:white;
    background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.09);
    display:flex; flex-direction:column; justify-content:center; align-items:flex-start; padding:15px;
}
.menuBtn:active{ transform:scale(.96); }
.menuBtn .icon{ font-size:24px; margin-bottom:5px; }
.menuBtn strong{ font-size:14px; }
.menuBtn small{ margin-top:2px; color:#8198a0; font-size:11px; }

/* 3D GARAGE */
#garage{ position:absolute; inset:0; display:none; background:#061118; color:white; }
#garage3D{ position:absolute; inset:0; width:100%; height:100%; }
.pageHead{
    position:absolute; top:0; left:0; right:0; height:60px; z-index:20;
    display:flex; align-items:center; justify-content:space-between; padding:0 16px;
    background:rgba(4,13,18,.75); backdrop-filter:blur(8px);
}
.back{ width:38px; height:38px; border-radius:10px; background:#14252c; color:white; font-size:18px; }
.pageTitle{ font-size:16px; font-weight:900; }
.selectBus{
    position:absolute; z-index:30; bottom:25px; left:50%; transform:translateX(-50%);
    width:85%; max-width:340px; padding:14px; border-radius:16px; background:#00d9ee;
    color:#001014; font-weight:900; font-size:15px; box-shadow:0 8px 25px rgba(0,217,238,.35);
}

/* DRIVING SCREEN */
#drive{ position:absolute; inset:0; display:none; background:#6eb4e8; }
#scene{ position:absolute; inset:0; }
.hud{ position:absolute; top:12px; left:12px; right:12px; z-index:20; display:flex; justify-content:space-between; align-items:flex-start; }
.hudBox{ padding:8px 14px; border-radius:12px; background:rgba(5,17,23,.85); color:white; backdrop-filter:blur(6px); font-size:13px; }
.hudBox.pointer{ cursor:pointer; }
.routeText b{ color:#00e5ff; }

.speedometer{
    position:absolute; right:16px; bottom:130px; z-index:30;
    width:95px; height:95px; border-radius:50%; background:rgba(5,20,18,.9);
    border:4px solid #00e58a; color:white; display:flex; align-items:center; justify-content:center; flex-direction:column;
}
.speedNumber{ font-size:26px; font-weight:900; line-height:1; }
.speedUnit{ color:#91a49e; font-size:10px; margin-top:2px; }

/* CONTROLS */
.controls{ position:absolute; left:0; right:0; bottom:16px; height:100px; z-index:50; pointer-events:none; }
.control{
    pointer-events:auto; position:absolute; border-radius:50%; color:white;
    background:rgba(3,12,15,.85); border:1px solid rgba(255,255,255,.15); font-size:22px;
    display:flex; align-items:center; justify-content:center; touch-action:none;
}
.leftBtn{ left:16px; bottom:10px; width:62px; height:62px; }
.rightBtn{ left:90px; bottom:10px; width:62px; height:62px; }
.brake{ right:105px; bottom:10px; width:62px; height:62px; }
.brake span{ width:26px; height:26px; border-radius:6px; background:#ff3d45; display:block; }
.gas{ right:16px; bottom:0; width:80px; height:80px; background:rgba(0,120,65,.85); border:2px solid rgba(0,255,130,.4); }
.control:active{ transform:scale(.92); }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>
</head>

<body>
<div id="game">

    <!-- SPLASH -->
    <section id="splash">
        <div class="logo">🚌</div>
        <div class="splashTitle">BUS SIMULATOR BD</div>
        <div class="splashSub">Dhaka Highway Express</div>
        <div class="loader"><div class="loaderBar"></div></div>
    </section>

    <!-- ASSET LOADER -->
    <div id="assetLoader">
        <div class="assetBox">
            <h4 id="assetTitle">Loading Bus 3D...</h4>
            <div class="assetBarBg"><div id="assetFill"></div></div>
            <small id="assetPercent">0%</small>
        </div>
    </div>

    <!-- MAIN MENU -->
    <section id="menu">
        <div class="topbar">
            <div class="brand">BUS <span>SIMULATOR BD</span></div>
            <div class="money">৳ <b>25,000</b></div>
        </div>
        <div class="hero">
            <small>BD HIGHWAY TOUR</small>
            <h1>Dhaka Highway<br><span>Express</span></h1>
        </div>
        <div class="menuButtons">
            <button class="menuBtn" onclick="openGarage()">
                <div class="icon">🚌</div>
                <strong>Garage</strong>
                <small>View 3D Bus</small>
            </button>
            <button class="menuBtn" onclick="startGame()">
                <div class="icon">▶️</div>
                <strong>Drive Now</strong>
                <small>Chittagong Highway</small>
            </button>
        </div>
    </section>

    <!-- GARAGE -->
    <section id="garage">
        <div class="pageHead">
            <button class="back" onclick="showMenu()">←</button>
            <div class="pageTitle">3D BUS GARAGE</div>
            <div style="width:38px"></div>
        </div>
        <div id="garage3D"></div>
        <button class="selectBus" onclick="startGame()">🚍 START DRIVING</button>
    </section>

    <!-- DRIVING -->
    <section id="drive">
        <div id="scene"></div>
        <div class="hud">
            <div class="hudBox routeText">📍 <b>Dhaka</b> → Chittagong</div>
            <div class="hudBox pointer" onclick="showMenu()">🏠 Menu</div>
        </div>
        <div class="speedometer">
            <div class="speedNumber" id="speedNumber">0</div>
            <div class="speedUnit">KM/H</div>
        </div>
        <div class="controls">
            <button class="control leftBtn" id="leftBtn">◀</button>
            <button class="control rightBtn" id="rightBtn">▶</button>
            <button class="control brake" id="brakeBtn"><span></span></button>
            <button class="control gas" id="gasBtn">▲</button>
        </div>
    </section>

</div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

/* GitHub Pages-এ রুট ডিরেক্টরি থেকে সরাসরি ফাইল লোড */
const BUS_URL = "./bus.glb";

let garageScene, garageCamera, garageRenderer, garageBus, garageControls;
let driveScene, driveCamera, driveRenderer, playerBus;
let speed = 0, targetSpeed = 0, steering = 0;
let gasPressed = false, brakePressed = false;
let keys = {};
let cachedBusModel = null;

const loader = new GLTFLoader();

function showLoader(txt){
    document.getElementById("assetLoader").style.display = "flex";
    document.getElementById("assetTitle").innerText = txt;
    document.getElementById("assetFill").style.width = "0%";
    document.getElementById("assetPercent").innerText = "0%";
}
function updateLoader(pct){
    document.getElementById("assetFill").style.width = pct + "%";
    document.getElementById("assetPercent").innerText = pct + "%";
}
function hideLoader(){
    document.getElementById("assetLoader").style.display = "none";
}

/* মডেল সাইজ ও রোকেশন অটো-অ্যাডজাস্ট */
function normalizeBusModel(raw, targetLength = 8.5){
    const root = new THREE.Group();
    raw.traverse(n => {
        if(n.isMesh){
            n.castShadow = true;
            n.receiveShadow = true;
            if(n.material) n.material.side = THREE.DoubleSide;
        }
    });

    const box = new THREE.Box3().setFromObject(raw);
    const size = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    raw.scale.setScalar(targetLength / (maxDim || 1));

    const reBox = new THREE.Box3().setFromObject(raw);
    const center = reBox.getCenter(new THREE.Vector3());
    raw.position.x = -center.x;
    raw.position.z = -center.z;
    raw.position.y = -reBox.min.y;

    root.add(raw);
    return root;
}

function loadBusModel(callback){
    if(cachedBusModel){
        callback(normalizeBusModel(cachedBusModel.clone()));
        return;
    }

    showLoader("Loading 3D Bus...");
    loader.load(
        BUS_URL,
        (gltf) => {
            hideLoader();
            cachedBusModel = gltf.scene;
            callback(normalizeBusModel(cachedBusModel.clone()));
        },
        (xhr) => {
            if(xhr.lengthComputable){
                const p = Math.round((xhr.loaded / xhr.total) * 100);
                updateLoader(p);
            }
        },
        (err) => {
            hideLoader();
            console.error("Bus Load Error:", err);
            alert("bus.glb ফাইলটি পাওয়া যায়নি! নিশ্চিত করুন ফাইলটি index.html-এর পাশেই আছে।");
        }
    );
}

/* GARAGE */
function initGarage(){
    const container = document.getElementById("garage3D");
    if(garageRenderer) return;

    garageScene = new THREE.Scene();
    garageScene.background = new THREE.Color(0x061118);

    garageCamera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
    garageCamera.position.set(8.5, 3.8, 9.5);

    garageRenderer = new THREE.WebGLRenderer({ antialias: true });
    garageRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    garageRenderer.setSize(container.clientWidth, container.clientHeight);
    garageRenderer.outputColorSpace = THREE.SRGBColorSpace;
    container.appendChild(garageRenderer.domElement);

    garageScene.add(new THREE.HemisphereLight(0xffffff, 0x11222b, 3.5));
    const dirLight = new THREE.DirectionalLight(0xffffff, 4.0);
    dirLight.position.set(5, 12, 6);
    garageScene.add(dirLight);

    const floor = new THREE.Mesh(
        new THREE.CylinderGeometry(7, 7, 0.25, 32),
        new THREE.MeshStandardMaterial({ color: 0x132731, roughness: 0.3 })
    );
    floor.position.y = -0.12;
    garageScene.add(floor);

    garageControls = new OrbitControls(garageCamera, garageRenderer.domElement);
    garageControls.enableDamping = true;
    garageControls.target.set(0, 1.4, 0);

    loadBusModel((model) => {
        garageBus = model;
        garageScene.add(garageBus);
    });

    function animate(){
        requestAnimationFrame(animate);
        garageControls.update();
        if(garageBus) garageBus.rotation.y += 0.003;
        garageRenderer.render(garageScene, garageCamera);
    }
    animate();
}

/* DRIVING */
function initDriving(){
    const container = document.getElementById("scene");
    if(driveRenderer) return;

    driveScene = new THREE.Scene();
    driveScene.background = new THREE.Color(0x6eb4e8);

    driveCamera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);

    driveRenderer = new THREE.WebGLRenderer({ antialias: true });
    driveRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    driveRenderer.setSize(window.innerWidth, window.innerHeight);
    driveRenderer.outputColorSpace = THREE.SRGBColorSpace;
    container.appendChild(driveRenderer.domElement);

    driveScene.add(new THREE.HemisphereLight(0xffffff, 0x3d5c2a, 3.2));
    const sun = new THREE.DirectionalLight(0xffffff, 4.0);
    sun.position.set(30, 80, 40);
    driveScene.add(sun);

    // ঘাস
    const grass = new THREE.Mesh(new THREE.PlaneGeometry(1000, 3000), new THREE.MeshStandardMaterial({ color: 0x367e3b }));
    grass.rotation.x = -Math.PI / 2;
    grass.position.y = -0.05;
    driveScene.add(grass);

    // রাস্তা
    const road = new THREE.Mesh(new THREE.PlaneGeometry(14, 3000), new THREE.MeshStandardMaterial({ color: 0x272c30, roughness: 0.8 }));
    road.rotation.x = -Math.PI / 2;
    driveScene.add(road);

    // রাস্তার হলুদ লাইন
    const lineMat = new THREE.MeshBasicMaterial({ color: 0xffcc00 });
    for(let z = -1400; z < 1400; z += 12){
        const line = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 5), lineMat);
        line.rotation.x = -Math.PI / 2;
        line.position.set(0, 0.02, z);
        driveScene.add(line);
    }

    buildRoadsideEnvironment();

    loadBusModel((bus) => {
        playerBus = bus;
        driveScene.add(playerBus);
        animateDriving();
    });
}

function buildRoadsideEnvironment(){
    const colors = [0x455a64, 0x546e7a, 0x37474f, 0x78909c];
    for(let z = -1400; z < 1400; z += 40){
        [-20, 20].forEach(x => {
            const h = 14 + Math.random() * 22;
            const w = 12 + Math.random() * 6;
            const b = new THREE.Mesh(
                new THREE.BoxGeometry(w, h, 14),
                new THREE.MeshStandardMaterial({ color: colors[Math.floor(Math.random() * colors.length)] })
            );
            b.position.set(x > 0 ? x + 10 : x - 10, h / 2, z);
            driveScene.add(b);

            const tree = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.3, 2.5), new THREE.MeshStandardMaterial({ color: 0x5a3d28 }));
            trunk.position.y = 1.25;
            const foliage = new THREE.Mesh(new THREE.SphereGeometry(1.6, 8, 8), new THREE.MeshStandardMaterial({ color: 0x1d7028 }));
            foliage.position.y = 3;
            tree.add(trunk, foliage);
            tree.position.set(x > 0 ? 9.5 : -9.5, 0, z + 12);
            driveScene.add(tree);
        });
    }
}

function updateDriving(){
    if(!playerBus) return;

    if(keys["ArrowUp"] || keys["w"] || gasPressed) targetSpeed = 85;
    else targetSpeed = 0;

    if(keys["ArrowDown"] || keys["s"] || brakePressed){
        targetSpeed = 0;
        speed -= 1.8;
        if(speed < 0) speed = 0;
    }

    if(speed < targetSpeed) speed += 0.7;
    else if(speed > targetSpeed) speed -= 0.35;

    if(keys["ArrowLeft"] || keys["a"]) steering = -1;
    else if(keys["ArrowRight"] || keys["d"]) steering = 1;
    else steering *= 0.8;

    playerBus.position.x += steering * speed * 0.0013;
    playerBus.position.x = THREE.MathUtils.clamp(playerBus.position.x, -5.2, 5.2);
    playerBus.position.z -= speed * 0.038;
    playerBus.rotation.y = -steering * 0.07;

    // ক্যামেরা ভিউ
    driveCamera.position.set(
        playerBus.position.x * 0.5,
        playerBus.position.y + 4.2,
        playerBus.position.z + 11.5
    );
    driveCamera.lookAt(playerBus.position.x, playerBus.position.y + 1.5, playerBus.position.z - 8);

    document.getElementById("speedNumber").textContent = Math.round(speed);
}

function animateDriving(){
    requestAnimationFrame(animateDriving);
    updateDriving();
    if(driveRenderer) driveRenderer.render(driveScene, driveCamera);
}

/* CONTROLS */
window.addEventListener("keydown", e => keys[e.key] = true);
window.addEventListener("keyup", e => keys[e.key] = false);

function bindHold(id, onDown, onUp){
    const el = document.getElementById(id);
    el.addEventListener("pointerdown", e => { e.preventDefault(); onDown(); });
    el.addEventListener("pointerup", e => { e.preventDefault(); onUp(); });
    el.addEventListener("pointerleave", onUp);
    el.addEventListener("pointercancel", onUp);
}

bindHold("gasBtn", () => gasPressed = true, () => gasPressed = false);
bindHold("brakeBtn", () => brakePressed = true, () => brakePressed = false);
bindHold("leftBtn", () => keys["ArrowLeft"] = true, () => keys["ArrowLeft"] = false);
bindHold("rightBtn", () => keys["ArrowRight"] = true, () => keys["ArrowRight"] = false);

window.addEventListener("resize", () => {
    if(driveCamera && driveRenderer){
        driveCamera.aspect = window.innerWidth / window.innerHeight;
        driveCamera.updateProjectionMatrix();
        driveRenderer.setSize(window.innerWidth, window.innerHeight);
    }
    const garageEl = document.getElementById("garage3D");
    if(garageCamera && garageRenderer && garageEl){
        garageCamera.aspect = garageEl.clientWidth / garageEl.clientHeight;
        garageCamera.updateProjectionMatrix();
        garageRenderer.setSize(garageEl.clientWidth, garageEl.clientHeight);
    }
});

/* NAVIGATION */
function hideAll(){
    ["menu", "garage", "drive"].forEach(id => {
        const el = document.getElementById(id);
        if(el) el.style.display = "none";
    });
}

window.showMenu = function(){ hideAll(); document.getElementById("menu").style.display = "block"; };
window.openGarage = function(){ hideAll(); document.getElementById("garage").style.display = "block"; setTimeout(initGarage, 50); };
window.startGame = function(){ hideAll(); document.getElementById("drive").style.display = "block"; if(!driveScene) initDriving(); };

setTimeout(() => {
    const splash = document.getElementById("splash");
    splash.style.opacity = "0";
    setTimeout(() => {
        splash.style.display = "none";
        window.showMenu();
    }, 400);
}, 1200);
</script>
</body>
</html>
